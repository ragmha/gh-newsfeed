name: Keepalive

# GitHub automatically disables scheduled workflows after 60 days without
# repository activity. Workflow runs do not count as activity — only commits do.
# This pushes a dated no-op commit monthly so the Deploy, digest and feed-fetcher
# schedules never get disabled again.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Re-enable any inactivity-disabled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow list --all --json name,state \
            --jq '.[] | select(.state == "disabled_inactivity") | .name' \
          | while read -r name; do
              echo "Re-enabling: $name"
              gh workflow enable "$name"
            done

      - name: Push keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive
          git add .github/last-keepalive
          git commit -m "chore: keepalive [skip ci]"
          git push
